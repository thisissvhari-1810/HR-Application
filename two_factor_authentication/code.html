<body class="bg-surface-bright font-body-md text-on-surface min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Background Atmosphere -->
<div class="fixed inset-0 z-0">

</div>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-md px-container-margin-mobile md:px-0">
<!-- Auth Card -->
<div class="glass-panel p-8 md:p-12 rounded-xl flex flex-col items-center text-center">
<!-- Branding/Security Icon -->
<div class="mb-8 w-16 h-16 rounded-full bg-primary-container/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="shield_lock" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">Two-Factor Authentication</h1>
<p class="font-body-md text-on-surface-variant mb-10 px-4">
                We've sent a 6-digit security code to your registered device. Enter it below to secure your session.
            </p>
<!-- OTP Input Form -->
<form class="w-full space-y-10" id="otp-form">
<div class="flex justify-between gap-2 md:gap-3">
<input autofocus="" class="otp-input w-full aspect-square text-center font-headline-md text-headline-md bg-surface-container-low border border-outline-variant/30 rounded-lg focus:outline-none focus:border-primary transition-all duration-200" maxlength="1" oninput="moveToNext(this, 0)" required="" type="number"/>
<input class="otp-input w-full aspect-square text-center font-headline-md text-headline-md bg-surface-container-low border border-outline-variant/30 rounded-lg focus:outline-none focus:border-primary transition-all duration-200" maxlength="1" oninput="moveToNext(this, 1)" required="" type="number"/>
<input class="otp-input w-full aspect-square text-center font-headline-md text-headline-md bg-surface-container-low border border-outline-variant/30 rounded-lg focus:outline-none focus:border-primary transition-all duration-200" maxlength="1" oninput="moveToNext(this, 2)" required="" type="number"/>
<input class="otp-input w-full aspect-square text-center font-headline-md text-headline-md bg-surface-container-low border border-outline-variant/30 rounded-lg focus:outline-none focus:border-primary transition-all duration-200" maxlength="1" oninput="moveToNext(this, 3)" required="" type="number"/>
<input class="otp-input w-full aspect-square text-center font-headline-md text-headline-md bg-surface-container-low border border-outline-variant/30 rounded-lg focus:outline-none focus:border-primary transition-all duration-200" maxlength="1" oninput="moveToNext(this, 4)" required="" type="number"/>
<input class="otp-input w-full aspect-square text-center font-headline-md text-headline-md bg-surface-container-low border border-outline-variant/30 rounded-lg focus:outline-none focus:border-primary transition-all duration-200" maxlength="1" oninput="moveToNext(this, 5)" required="" type="number"/>
</div>
<div class="space-y-4">
<button class="w-full h-12 bg-primary text-on-primary font-body-lg text-body-lg font-semibold rounded-full hover:bg-primary-container active:scale-95 transition-all duration-200 shadow-md shadow-primary/10" type="submit">
                        Verify Identity
                    </button>
<div class="flex items-center justify-center gap-2 pt-2">
<span class="font-label-md text-label-md text-on-surface-variant">Didn't receive the code?</span>
<button class="font-label-md text-label-md text-primary font-bold hover:underline cursor-pointer transition-all" id="resend-btn" type="button">
                            Resend Code
                        </button>
</div>
</div>
</form>
<!-- Status Indicator -->
<div class="mt-8 flex items-center gap-2 text-primary font-label-md text-label-md hidden" id="status-message">
<span class="material-symbols-outlined text-sm animate-spin" data-icon="sync">sync</span>
                Verifying secure credentials...
            </div>
</div>
<!-- Security Footer Info -->
<footer class="mt-8 flex flex-col items-center gap-4">
<div class="flex items-center gap-2 text-secondary opacity-60">
<span class="material-symbols-outlined text-sm" data-icon="lock">lock</span>
<span class="font-label-md text-label-md">End-to-end encrypted connection</span>
</div>
<div class="flex gap-6 opacity-40 font-label-md text-label-md">

</div>
<div class="fixed bottom-20 left-[10%] opacity-10 pointer-events-none hidden xl:block">
<div class="w-48 h-48 rounded-full overflow-hidden grayscale contrast-125 -rotate-6" data-alt="Abstract architectural photography of a glass and steel data center facility. The view is upward, capturing rhythmic patterns of support beams and reflective glass panels against a clear, high-key sky. The mood is structural, transparent, and professional, perfectly aligning with an enterprise security brand identity." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCBtLF20lEQSux1M9MJg2gUJipImFhInfPzgY8Qvkrn1Hh1Mkjthjokm71mBkJss9dVU9ybsweQB4g9eyT2Ajl0cKiAeTTWrOPtUyqZ0x3aWp7V92pRPtiU98nLygnJZb2NXPgzXHTNi_4gZY2XWGFTzzmEmBs4cQ6LVV3NFqTBt1NQahttuFgFPIRqP2bfhNuroqVOH0nxbkGWxIe0q6YzvZparxSpqT9SP6UC6MgPMpY8cxIt8B_J6l7OMANONHEYzZ58SzyEsq5r')"></div>
</div>
<script>
        function moveToNext(field, index) {
            const inputs = document.querySelectorAll('.otp-input');
            if (field.value.length >= 1) {
                if (index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            }
        }

        // Handle Backspace
        document.querySelectorAll('.otp-input').forEach((input, index) => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    document.querySelectorAll('.otp-input')[index - 1].focus();
                }
            });
            
            // Handle paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = e.clipboardData.getData('text').slice(0, 6);
                const inputs = document.querySelectorAll('.otp-input');
                [...pasteData].forEach((char, i) => {
                    if (inputs[i]) {
                        inputs[i].value = char;
                        if (i < inputs.length - 1) inputs[i+1].focus();
                    }
                });
            });
        });

        // Form Submission Simulation
        document.getElementById('otp-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const status = document.getElementById('status-message');
            
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>`;
            status.classList.remove('hidden');

            // Simulate API call
            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span> Verified`;
                btn.classList.replace('bg-primary', 'bg-green-600');
                status.innerHTML = `<span class="text-green-600 font-bold">Access Granted. Redirecting...</span>`;
            }, 1800);
        });

        // Resend Timer Simulation
        let cooldown = 0;
        document.getElementById('resend-btn').addEventListener('click', (e) => {
            if (cooldown > 0) return;
            
            const btn = e.target;
            cooldown = 60;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            btn.innerHTML = `Resend in ${cooldown}s`;
            
            const timer = setInterval(() => {
                cooldown--;
                if (cooldown <= 0) {
                    clearInterval(timer);
                    btn.innerHTML = 'Resend Code';
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                } else {
                    btn.innerHTML = `Resend in ${cooldown}s`;
                }
            }, 1000);
        });
    </script>
</body></html>
