# =============================================================================
# Nexus Ecosystem — Compose stack
# -----------------------------------------------------------------------------
# Single static-site service served by nginx (see Dockerfile + nginx.conf).
#
# Usage:
#   docker compose up -d --build      # build image & start in background
#   docker compose logs -f web        # tail logs
#   docker compose ps                 # check status / healthcheck
#   docker compose down               # stop and remove containers
#
# Visit:  http://localhost:3000
#
# Override the host port without editing this file:
#   HOST_PORT=8080 docker compose up -d
# =============================================================================

name: nexus-ecosystem

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexus-ecosystem:latest
    container_name: nexus-web
    restart: unless-stopped

    ports:
      - "${HOST_PORT:-3000}:3000"

    environment:
      TZ: ${TZ:-UTC}

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Mount the source read-only so edits to any code.html, shared/*.css or
    # shared/*.js show up on refresh — comment out for an immutable image.
    volumes:
      - ./shared:/usr/share/nginx/html/shared:ro
      - ./platform_landing_page:/usr/share/nginx/html/platform_landing_page:ro
      - ./login_employee_ecosystem:/usr/share/nginx/html/login_employee_ecosystem:ro
      - ./create_enterprise_account:/usr/share/nginx/html/create_enterprise_account:ro
      - ./two_factor_authentication:/usr/share/nginx/html/two_factor_authentication:ro
      - ./nexus_enterprise:/usr/share/nginx/html/nexus_enterprise:ro
      - ./personal_employee_dashboard:/usr/share/nginx/html/personal_employee_dashboard:ro
      - ./hr_administration_dashboard:/usr/share/nginx/html/hr_administration_dashboard:ro
      - ./executive_dashboard:/usr/share/nginx/html/executive_dashboard:ro
      - ./managerial_insights_dashboard:/usr/share/nginx/html/managerial_insights_dashboard:ro
      - ./enterprise_messaging_chat:/usr/share/nginx/html/enterprise_messaging_chat:ro
      - ./communities_groups_hub:/usr/share/nginx/html/communities_groups_hub:ro
      - ./company_news_feed:/usr/share/nginx/html/company_news_feed:ro
      - ./social_news_feed_stories:/usr/share/nginx/html/social_news_feed_stories:ro
      - ./performance_review_center:/usr/share/nginx/html/performance_review_center:ro
      - ./payroll_benefits:/usr/share/nginx/html/payroll_benefits:ro
      - ./project_kanban_board:/usr/share/nginx/html/project_kanban_board:ro
      - ./recruitment_pipeline_dashboard:/usr/share/nginx/html/recruitment_pipeline_dashboard:ro
      - ./employee_onboarding_workflow:/usr/share/nginx/html/employee_onboarding_workflow:ro
      - ./employee_social_profile:/usr/share/nginx/html/employee_social_profile:ro
      - ./organizational_hierarchy_chart:/usr/share/nginx/html/organizational_hierarchy_chart:ro
      - ./ai_intelligence_hub:/usr/share/nginx/html/ai_intelligence_hub:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro

    # Drop everything we don't need; nginx only needs to bind 3000 and read.
    security_opt:
      - no-new-privileges:true

    # Sensible production resource ceiling.
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

    networks:
      - nexus-net

    labels:
      org.opencontainers.image.title: "Nexus Ecosystem"
      org.opencontainers.image.description: "Enterprise HRMS + social platform static site"
      org.opencontainers.image.source: "https://github.com/your-org/HR-Application"

networks:
  nexus-net:
    name: nexus-net
    driver: bridge
