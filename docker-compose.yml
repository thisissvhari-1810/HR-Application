# =============================================================================
# Nexus Ecosystem — Compose stack
# -----------------------------------------------------------------------------
# Single static-site service served by nginx (see Dockerfile + nginx.conf).
#
# Usage:
#   docker compose up -d --build      # build image & start in background
#   docker compose logs -f web        # tail logs
#   docker compose ps                 # check status / healthcheck
#   docker compose down               # stop and remove containers
#
# Visit:  http://localhost:3000
#
# Override the host port without editing this file:
#   HOST_PORT=8080 docker compose up -d
# =============================================================================

name: nexus-ecosystem

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexus-ecosystem:latest
    container_name: nexus-web
    restart: unless-stopped

    ports:
      - "${HOST_PORT:-3000}:3000"

    environment:
      TZ: ${TZ:-UTC}

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # NOTE: Intentionally NO bind mounts.
    #   - For CI/CD (Jenkins): the Dockerfile already `COPY . .` bakes every
    #     file into the image, and bind mounts break when Jenkins itself runs
    #     in a container against the host docker daemon (the source paths
    #     don't exist on the host).
    #   - For local dev hot-reload: create a docker-compose.override.yml
    #     beside this file with a `volumes:` section pointing at ./ → /usr/share/nginx/html.
    #     Compose auto-merges overrides on `docker compose up`.

    # Drop everything we don't need; nginx only needs to bind 3000 and read.
    security_opt:
      - no-new-privileges:true

    # Sensible production resource ceiling.
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

    networks:
      - nexus-net

    labels:
      org.opencontainers.image.title: "Nexus Ecosystem"
      org.opencontainers.image.description: "Enterprise HRMS + social platform static site"
      org.opencontainers.image.source: "https://github.com/your-org/HR-Application"

networks:
  nexus-net:
    name: nexus-net
    driver: bridge
