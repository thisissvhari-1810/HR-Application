# Nexus Ecosystem — nginx server block (lives at /etc/nginx/conf.d/default.conf)

server {
    listen       3000 default_server;
    listen       [::]:3000 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;
    charset utf-8;

    # ---- Compression -----------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---- Security headers -----------------------------------------------
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "SAMEORIGIN"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # ---- Caching ---------------------------------------------------------
    # HTML pages: always re-validate so users get the latest nav shell.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Shared CSS/JS: cache for a week (bust by editing filenames if needed).
    location /shared/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Generic static assets: 1 day.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # ---- Routing ---------------------------------------------------------
    # Pretty URLs: /personal_employee_dashboard/  →  /personal_employee_dashboard/code.html
    location / {
        try_files $uri $uri/ $uri/code.html =404;
    }

    # ---- Errors ----------------------------------------------------------
    error_page 404 /platform_landing_page/code.html;
}
